  <text x="408" y="114" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Settings</text>
  <text x="408" y="138" fill="#9aa3b5" font-family="Segoe UI, Arial" font-size="13">App preferences</text>
  <rect x="408" y="164" width="464" height="110" rx="12" fill="#171b24" stroke="#2a3140"/>
  <text x="428" y="192" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Startup</text>
