<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="g" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#2a1a12"/>
      <stop offset="55%" stop-color="#12141a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a2f"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0b0d12"/>
  <rect x="380" y="70" width="520" height="580" rx="16" fill="#12141a" stroke="#2a3140"/>
