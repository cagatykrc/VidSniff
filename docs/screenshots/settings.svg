  <text x="456" y="224" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="13">Launch VidSniff when Windows starts</text>
  <text x="428" y="252" fill="#9aa3b5" font-family="Segoe UI, Arial" font-size="12">Runs quietly in the tray so downloads are ready</text>
  <rect x="408" y="290" width="464" height="140" rx="12" fill="#171b24" stroke="#2a3140"/>
  <text x="428" y="318" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Downloads</text>
  <text x="428" y="340" fill="#9aa3b5" font-family="Segoe UI, Arial" font-size="12">Files are saved here</text>
  <rect x="428" y="354" width="424" height="36" rx="8" fill="#0f1218" stroke="#2a3140"/>
  <text x="440" y="377" fill="#fdba74" font-family="Consolas, monospace" font-size="11">%LOCALAPPDATA%\VidSniff\downloads</text>
