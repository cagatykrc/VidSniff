  <rect x="428" y="512" width="180" height="28" rx="8" fill="#1a1e27" stroke="#2a3140"/>
  <text x="448" y="531" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="12">Extension assistant</text>
  <text x="408" y="590" fill="#9aa3b5" font-family="Segoe UI, Arial" font-size="12">VidSniff 1.7.0</text>
  <rect x="760" y="570" width="72" height="28" rx="8" fill="#1a1e27" stroke="#2a3140"/>
  <text x="780" y="589" fill="#eef1f6" font-family="Segoe UI, Arial" font-size="12">Close</text>
