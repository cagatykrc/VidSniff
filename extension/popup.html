<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidSniff</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>VidSniff</h1>
        <p class="sub" data-i18n="popupSub">Download this video</p>
      </div>
    </div>
    <div id="status" class="status offline">service off</div>
  </header>

  <section id="jobs" class="jobs" hidden></section>

  <main class="now">
    <article id="primary" class="primary empty">
      <div class="p-kicker" data-i18n="nowPlaying">Now playing</div>
      <div class="p-title">Appears when you play a video</div>
      <div class="p-meta">Start the video on the page → MP4 download shows up</div>
      <div class="p-actions">
        <button id="dlPrimary" class="primary-btn" type="button" disabled>Download MP4</button>
      </div>
      <div id="primaryMsg" class="msg" hidden></div>
    </article>

    <details class="more">
      <summary data-i18n="moreCaptures">All captures</summary>
      <div id="list" class="list"></div>
    </details>
  </main>

  <footer class="foot">
    <span data-i18n="footerHint">The orange player panel does the same job</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
