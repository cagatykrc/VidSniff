<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidSniff</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>VidSniff</h1>
        <p class="sub" data-i18n="panelSub">Tray download panel</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="openDir" type="button" class="ghost" data-i18n="panelFolder">Folder</button>
      <button id="openSettings" type="button" class="ghost" data-i18n="panelSettings">Settings</button>
    </div>
  </header>

  <div class="install-bar">
    <span data-i18n="panelInstallHint">Videos won’t be caught without the extension.</span>
    <button id="openSetup" type="button" class="primary" data-i18n="panelInstallBtn">Install extension</button>
  </div>

  <main id="list" class="list">
    <div class="empty" data-i18n="panelEmpty">No downloads yet.</div>
  </main>

  <script src="panel.js"></script>
</body>
</html>
