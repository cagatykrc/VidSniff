<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidSniff</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>VidSniff</h1>
        <p class="sub">Sistem tepsisi indirme paneli</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="openDir" type="button" class="ghost">Klasör</button>
      <button id="openSettings" type="button" class="ghost">Ayarlar</button>
    </div>
  </header>

  <div class="install-bar">
    <span>Eklenti yoksa video yakalanmaz.</span>
    <button id="openSetup" type="button" class="primary">Eklenti kur</button>
  </div>

  <main id="list" class="list">
    <div class="empty">Henüz indirme yok. Eklentiden video indir.</div>
  </main>

  <script src="panel.js"></script>
</body>
</html>
